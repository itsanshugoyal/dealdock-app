<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DealDock — offline</title>
<style>
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    background:#050505; color:#fafafa; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .card { text-align:center; padding:24px; max-width:320px; }
  .logo { width:48px; height:48px; border-radius:12px; background:#ffc107; color:#050505;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:20px; margin:0 auto 16px; }
  h1 { font-size:18px; margin:0 0 8px; }
  p { font-size:13px; color:#737373; line-height:1.5; margin:0 0 20px; }
  button { min-height:44px; padding:0 24px; border-radius:999px; border:0; background:#ffc107;
    color:#050505; font-weight:700; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">₹</div>
    <h1>You're offline</h1>
    <p>Nothing sends or closes without a connection — no queued surprises. Your inbox picks up exactly where it left off.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
