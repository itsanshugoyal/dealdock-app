<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F3F3F6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
<title>DealDock — offline</title>
<style>
  /* Token values inlined from DESIGN.md v3: this page must render with no network. */
  :root { color-scheme: light; --canvas:#F3F3F6; --surface:#FFFFFF; --text-1:#0B0B10; --text-2:#4A4A55; --ink:#0B0B10; --on-ink:#FFFFFF; --brand:#0A9B68; --focus:#1F6FEB; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --canvas:#09090B; --surface:#141417; --text-1:#F4F4F6; --text-2:#ABABB6; --ink:#F4F4F6; --on-ink:#09090B; --brand:#2FD58E; --focus:#6EA8FF; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:16px;
    background:var(--canvas); color:var(--text-1); font:16px/22px "Geist", -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  main { text-align:center; max-width:340px; }
  .mark { width:56px; height:56px; margin:0 auto 24px; border-radius:16px; background:var(--brand); display:flex; align-items:center; justify-content:center; }
  h1 { font-weight:700; font-size:28px; line-height:34px; letter-spacing:-0.025em; margin:0 0 8px; }
  p { color:var(--text-2); margin:0 0 24px; }
  button { height:48px; padding:0 22px; border-radius:999px; border:0; background:var(--ink); color:var(--on-ink); font:inherit; font-weight:600; cursor:pointer; }
  button:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.4A8 8 0 1 1 21 12z"/><path d="m8.5 13.5 2.5-2.5 2 2 3-3"/></svg>
    </div>
    <h1>You're offline.</h1>
    <p>Nothing sends or closes without a connection, so there are no queued surprises. Your drafts are still here.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
