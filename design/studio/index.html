p class="fact-explain">Facts support the reply. A writing style never invents a price, a place or a promise.</p></div></section><section aria-label="Reply workspace">'+(isReady?'<div class="compose"><div class="compose-head"><div class="compose-title">Your reply<button class="style-token" data-view="style">'+icon('style')+(profile().consent?esc(profile().short)+"'s style":'Style off')+'</button></div><div class="style-applied">'+(profile().consent?writingTags().map(function(t){return '<span class="chip">'+t+'</span>'}).join(''):'<span class="chip">Write your own reply</span>')+'</div></div><div class="editor-area"><label for="reply">Review the words before you approve</label><textarea id="reply" name="reply" maxlength="4000" spellcheck="true">'+esc(c.draft)+'</textarea><div class="editor-bar"><button data-action="reset-draft">'+icon('style')+' Rebuild from this style</button><span class="mono" id="replyCount">'+c.draft.length+'/4000</span></div></div><div class="draft-note">'+icon('info')+'<span>'+(c.audio?'Audio is not transcribed. Write this reply only after listening in Instagram.':c.availability===null?'Availability is unconfirmed. This draft says you’ll check; it does not promise a place.':'This draft uses the offer facts and your saved writing preferences. Review every detail.')+'</span></div><div class="approval"><small>A deliberate send.<br>Always your decision.</small><button class="primary lime" id="reviewReply" data-action="review-reply" '+(!c.draft.trim()?'disabled':'')+'>Review reply '+icon('arrow')+'</button></div></div>':c.state==='closed'?'<div class="sent-panel"><div class="sent-mark">'+icon('check')+'</div><h2>A confirmed outcome.</h2><p>You recorded this sale in the fictional revenue record.</p><button class="primary" data-view="revenue">View revenue record '+icon('arrow')+'</button></div>':c.audio&&c.state==='review'?'<div class="sent-panel"><span class="eyebrow">No automatic guess</span><h2>Listen before deciding.</h2><p>The current product can’t transcribe or play this audio. Review it in Instagram, then decide whether it is a buying enquiry. This preview does not open an account.</p><button class="secondary" data-action="review-classification">Review classification '+icon('arrow')+'</button></div>':'<div class="sent-panel"><div class="sent-mark">'+icon('check')+'</div><h2>'+(c.approved?'Approved in this preview.':'Waiting for their reply.')+'</h2><p>'+(c.approved?'Your edited words are now in the fictional conversation. No real message was sent.':'You’ve answered. There is no automatic follow-up or scheduled send.')+'</p><button class="primary" data-view="work">Back to your conversations '+icon('arrow')+'</button></div>')+'<div class="thread-tools">'+(c.state!=='closed'?'<button class="tertiary" data-action="sale">'+icon('revenue')+' Record a confirmed sale</button>':'')+(c.state==='reply'?'<button class="tertiary" data-action="wait">'+icon('clock')+' I replied elsewhere</button>':'')+'</div></section></div>'+footer()

function findExample(){return cases.find(function(c){return c.creator===creator&&c.state!=='closed'&&!c.audio&&c.messages.some(function(m){return m.dir==='in'})})||cases.find(function(c){return c.creator===creator&&!c.audio&&c.messages.some(function(m){return m.dir==='in'})})}
function stylePreviewText(example){if(!profile().consent)return 'Style matching is off. You can still classify conversations and write your own replies.';if(sampleCount()<3)return 'Select at least 3 outgoing text replies to build a representative style. No personalized preview is generated from an empty sample set.';return makeDraft(example)}
function wordCheck(text){var blocked=profile().avoid.split(',').map(function(w){return w.trim()}).filter(function(w){return w&&text.toLowerCase().includes(w.toLowerCase())});return blocked.length?'Review these flagged words: '+blocked.join(', ')+'.':'Word check: no flagged terms in this preview.'}
function decorateStudio(){if(view!=='style')return;var node=document.createElement('p');node.id='wordCheck';node.className='small';node.style.marginTop='12px';node.textContent=wordCheck(stylePreviewText(findExample()));document.querySelector('.preview-reason').append(node)}
function studio(){

function revenue(){

function render(){nav();document.getElementById('main').innerHTML=view==='work'?work():view==='thread'?thread():view==='style'?studio():revenue();document.getElementById('toast').hidden=true;decorateStudio()}
function saveDraft(){var input=document.getElementById('reply'),c=current();if(input&&c)c.draft=input.value}

function openCase(id){saveDraft();var c=cases.find(function(x){return x.id===id});if(!c)return;creator=c.creator;active=id;view='thread';render();document.getElementById('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}
function modal(title,html){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogBody').innerHTML=html;document.getElementById('dialog').showModal()}

function notify(text){var el=document.getElementById('toast');clearTimeout(toastTimer);el.textContent=text;el.hidden=false;toastTimer=setTimeout(function(){el.hidden=true},5000)}
function updateStylePreview(){var p=profile(),example=findExample();document.getElementById('stylePreview').textContent=stylePreviewText(example);document.getElementById('styleTags').innerHTML=writingTags().map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('');document.getElementById('selectedCount').textContent=sampleCount()+' / '+p.samples.length+' selected';document.getElementById('styleSource').textContent=sampleCount()+' selected example replies · preferences affect the preview instantly. Selecting samples changes the proposed source set; it does not run AI training.';document.getElementById('wordCheck').textContent=wordCheck(stylePreviewText(example))}
function search(query){var found=cases.filter(function(c){return c.creator===creator&&(c.name+' '+c.handle+' '+c.ask+' '+c.preview).toLowerCase().includes(query.toLowerCase())});document.getElementById('searchResults').innerHTML=found.length?found.map(function(c){return '<button class="search-result" data-search-case="'+c.id+'"><span><strong>'+esc(c.name)+'</strong><small>'+esc(c.ask)+'</small></span>'+icon('arrow')+'</button>'}).join(''):'<p>No conversations match. Try a name or a question.</p>'}
document.addEventListener('click',function(event){

if(a==='close-dialog'){closeDialog();return}
if(a==='about'){modal('A different way to work the inbox.','<p>This is a standalone design concept for the authenticated DealDock product. All names, conversations, prices and style examples are fictional. Nothing connects to Instagram, Claude or billing.</p><p><strong>Try the full loop:</strong> open Isha’s conversation, check the offer facts, edit the reply, review and approve the local simulation, then record a sale.</p><p>Open Writing style to change the tone, exclude samples, and switch creators to see how profiles remain separate. The studio is proposed UX; the current backend’s manual style refresh and audio limitations are documented separately.</p><p>Every change resets when you refresh this HTML. No browser storage, API request or real send is used.</p>');return}
if(a==='creators'){modal('One workspace. Separate creators.','<p>Switch between two fictional creators to inspect the different conversations, offer context and writing styles. Multi-creator UX here is a concept, not a claim that Roster onboarding has passed production acceptance.</p>'+Object.keys(creators).map(function(id){var p=creators[id];return '<button class="creator-choice" data-creator="'+id+'"><span class="avatar '+(id==='reva'?'reva':'')+'">'+p.initials+'</span><span><strong>'+p.name+'</strong><small>@'+p.handle+' · '+p.business+'</small></span>'+icon(id===creator?'check':'arrow')+'</button>'}).join(''));return}
if(a==='search'){modal('Find a conversation','<div class="field"><label for="search">Name, question or Instagram handle</label><input id="search" name="search" type="search" autocomplete="off" placeholder="Try Isha or payment…"></div><div id="searchResults"></div>');search('');document.getElementById('search').focus();return}
if(a==='reset-draft'){if(c.audio){notify('Audio has not been transcribed. Listen in Instagram and write your own reply.');return}if(sampleCount()<3){notify('Choose at least three style samples before rebuilding.');return}if(!profile().consent){notify('Writing-style matching is off. Keep writing your own reply.');return}if(c.draft!==makeDraft(c)){modal('Replace the current draft?','<p>This rebuilds the fictional draft from this creator’s current preferences. Any edits you made to this reply will be replaced.</p><button class="primary" data-action="confirm-reset">Replace draft '+icon('arrow')+'</button>')}else notify('This draft already uses the current style.');return}
if(a==='confirm-reset'){c.draft=makeDraft(c);closeDialog();render();notify('Draft rebuilt locally. Review it before approving.');return}
if(a==='availability'){modal(creator==='reva'?'Keep the scope honest.':'What do you know about November?',creator==='reva'?'<p>Usage rights are not in the brief. The draft asks for them rather than assuming they are included in the budget. This preview does not sign or change an agreement.</p>':'<p>Only confirm a place if you have checked availability. This changes the fictional offer context; your edited draft remains unchanged until you rebuild it.</p><form id="availabilityForm"><div class="field"><label for="available">November availability</label><select id="available" name="available"><option value="unknown" '+(c.availability===null?'selected':'')+'>Not confirmed</option><option value="yes" '+(c.availability===true?'selected':'')+'>A place is available</option><option value="no" '+(c.availability===false?'selected':'')+'>November is full</option></select></div><button class="primary">Save offer context '+icon('check')+'</button></form>');return}

if(a==='audio-info'){modal('Writing style and spoken audio are different.','<p>The current product learns writing preferences from consented outgoing <strong>text</strong> replies. It does not clone the creator’s speaking voice.</p><p>Reliable audio identification, in-app playback, transcription, generated speech and audio sending still need implementation and provider verification. This preview does not pretend to play or send a voice note.</p>');return}
if(a==='review-classification'){modal('Give this message a decision','<p>Listen in Instagram before making this decision. In this fictional preview, you can try routing it without pretending that a transcript exists.</p><form id="classificationForm"><div class="field"><label for="label">Your classification</label><select id="label" name="label"><option value="review">Keep in human review</option><option value="reply">Coaching enquiry</option><option value="closed">Not a buyer enquiry</option></select></div><button class="primary">Save review decision '+icon('check')+'</button></form>');return}
if(a==='revoke'){profile().consent=false;profile().samples=[];profile().greeting='';profile().signoff='';profile().avoid='';ownCases().forEach(function(x){if(!x.approved&&x.state!=='closed')x.draft=''});closeDialog();render();notify('Fictional style samples cleared for '+profile().short+'. The other creator is unchanged.');return}

});
document.addEventListener('input',function(event){

if(el.id==='consent'){if(!el.checked){el.checked=true;modal('Turn writing-style matching off?','<p>This clears '+esc(profile().short)+'’s fictional style samples and unsent preview drafts. It does not affect the other creator. No real account data is connected to this HTML.</p><button class="primary" data-action="revoke">Clear this fictional profile '+icon('lock')+'</button>')}else{profile().consent=true;render();notify('Preview consent enabled. No samples were read or restored. Reload to restore the fictional dataset.')}}

document.addEventListener('submit',function(event){
