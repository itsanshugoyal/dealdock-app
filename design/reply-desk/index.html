<aside class="queue" aria-label="Enquiry queue"><div class="brand">deal<span>dock</span><i>.</i></div><button class="org-switch" data-action="workspace"><span><span class="tiny-square">A</span>Anika / The Practice</span><svg style="width:13px;height:13px"><use href="#i-down"/></svg></button><button class="search" data-action="search"><svg style="width:17px;height:17px"><use href="#i-search"/></svg>Find a conversation<kbd>⌘ K</kbd></button><div class="queue-title"><h2>Your next replies</h2><span class="mono" id="queueCount">04</span></div><div class="tabs" aria-label="Filter enquiries"><button data-filter="ready" aria-pressed="true">Ready <span id="readyCount">4</span></button><button data-filter="waiting" aria-pressed="false">Waiting <span id="waitingCount">2</span></button></div><div class="items" id="items"></div><div class="queue-bottom"><div style="display:flex;justify-content:space-between"><span>Today’s replies</span><span class="mono" id="dailyCount">3 of 7</span></div><div class="progress" id="progress"></div><p>Small queue. Your full attention.</p></div></aside>
<main class="main" id="content" tabindex="-1"><header class="topbar"><div class="breadcrumb"><button class="iconbutton mobile-back" data-action="back" aria-label="Back to enquiries"><svg><use href="#i-back"/></svg></button><span>Your workspace</span><span aria-hidden="true">/</span><strong id="breadcrumb">Reply desk</strong></div><div class="top-right"><span class="preview-label">INTERACTIVE PROTOTYPE</span><button class="iconbutton" data-action="help" aria-label="About this prototype"><svg><use href="#i-help"/></svg></button></div></header><div id="view"></div><footer class="worklog"><span class="line"><svg style="height:14px;width:14px"><use href="#i-check"/></svg><strong>Only you send.</strong><span class="dot"></span>Every reply starts with your approval.</span><span>Fictional workspace · resets on refresh</span></footer></main>
</div>
<nav class="mobile-nav" id="mobileNav" aria-label="Main navigation"></nav>
<dialog id="modal" aria-labelledby="modalTitle"><div class="dialog-head"><h2 id="modalTitle"></h2><button class="iconbutton" data-action="dismiss" aria-label="Close dialog"><svg><use href="#i-close"/></svg></button></div><div class="dialog-body" id="modalBody"></div></dialog>
<div class="toast" role="status" aria-live="polite" id="toast"></div>
<script>
const icon=(name)=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc=(v)=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n)=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:n%100===0?0:2,maximumFractionDigits:2}).format(n/100);
const enquiries=[
{id:'meera',name:'Meera Iyer',handle:'meera.moves',initials:'MI',time:'12 min',kind:'Coaching',price:2250000,offer:'The 8-week Practice',offerDesc:'1:1 movement coaching · next intake 4 Nov',text:'I think I’m ready for the 8-week programme. Can I split the payment into two? And is there a spot for November?',draft:'Hey Meera! Yes, we can do two payments of ₹11,250. And there’s a November spot with your name on it.\n\nWant me to send you the enrolment details?',reason:'Asked about payment',detail:'A specific programme and a buying question.',history:'You: The Practice is 8 weeks of 1:1 coaching. We work around your schedule, with a check-in every Friday.',state:'ready',window:'23h 48m',status:'draft'},
{id:'kabir',name:'Kabir Malhotra',handle:'kabir.studio',initials:'KM',time:'38 min',kind:'Partnership',price:3800000,offer:'November partnership',offerDesc:'2 reels + 3 story frames · creator rate card',text:'Hey Anika, we loved your morning routine reel. We have ₹38,000 for a November collaboration. Could you share your availability?',draft:'Hey Kabir, thanks for thinking of me! November works. Could you send over the brief and the usage rights you have in mind?\n\nI’ll put together the scope from there.',reason:'Budget included',detail:'The buyer stated ₹38,000; scope still needs agreement.',history:'This is the first message in this conversation.',state:'ready',window:'23h 22m',status:'draft'},
{id:'rhea',name:'Rhea Desai',handle:'rhea.afterhours',initials:'RD',time:'1h',kind:'Course',price:490000,offer:'Move at Your Pace',offerDesc:'Self-paced foundations · 12 lessons',text:'Is the foundations course suitable if I’m starting from zero? I’ve followed your videos for a while but never done a proper programme.',draft:'Absolutely, Rhea. That’s exactly where we start: the basics, at your pace. No experience or equipment needed.\n\nWould you like a look at the first lesson before you decide?',reason:'Checking fit',detail:'Course interest; value is based on your offer, not a commitment.',history:'Rhea: Been following your videos for months. Your explanation of hip mobility finally clicked for me!',state:'ready',window:'22h 51m',status:'draft'},
{id:'dev',name:'Dev Arora',handle:'dev.on.the.move',initials:'DA',time:'2h',kind:'Coaching',price:2250000,offer:'The 8-week Practice',offerDesc:'1:1 movement coaching · next intake 4 Nov',text:'Can we do an intro call this week? My work hours are a little all over the place, so I wanted to check how the sessions work.',draft:'Hey Dev! We can work around that. Sessions are booked week by week, so you’re not tied to one time.\n\nI have Thursday at 6pm or Friday at 11am for a quick intro. Would either suit?',reason:'Wants an intro call',detail:'Coaching interest; no sale has been recorded.',history:'Dev: Hi! A friend recommended your coaching.',state:'ready',window:'21h 43m',status:'draft'},
{id:'tara',name:'Tara Sethi',handle:'tara.sethi',initials:'TS',time:'Yesterday',kind:'Coaching',price:2250000,offer:'The 8-week Practice',offerDesc:'1:1 movement coaching',text:'Thanks, let me check my schedule and get back to you.',draft:'',reason:'Waiting for Tara',detail:'You replied yesterday. The Instagram reply window is now closed.',history:'You: Of course, take your time. I’m here if any questions come up.',state:'waiting',window:'closed',status:'sent'},
{id:'nilo',name:'Nilo Collective',handle:'nilo.collective',initials:'NC',time:'3h',kind:'Partnership',price:4500000,offer:'Nilo creator partnership',offerDesc:'Scope shared · awaiting brief',text:'Lovely, I’ll get the brief across by tomorrow morning.',draft:'',reason:'Brief due tomorrow',detail:'You’ve shared your rates. There’s no next action yet.',history:'You: That sounds aligned. Send the brief and I’ll take a look.',state:'waiting',window:'20h 12m',status:'sent'}];
let ledger=[{name:'Ishani Kapoor',type:'Coaching',amount:2250000,date:'26 Oct'},{name:'Pine & Form',type:'Partnership',amount:3400000,date:'22 Oct'},{name:'Zoya Fernandes',type:'Coaching',amount:2250000,date:'19 Oct'},{name:'Arjun Sen',type:'Course',amount:490000,date:'15 Oct'}];
let reviews=[{id:'anya',name:'Anya Rao',text:'Hey, are you taking people for the November thing? Asking for my sister.',note:'Could be a coaching enquiry. Needs your context.'},{id:'tide',name:'Tide Running Club',text:'We should do something together for the winter run.',note:'A collaboration idea, with no paid scope yet.'}];
let active='meera',view='desk',filter='ready',replied=3,voice=true,historyOpen=false,toastTimer;
const navs=[['desk','desk','Reply desk'],['review','review','Review'],['ledger','ledger','Revenue'],['settings','settings','Settings']];
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),4500)}
function saveDraft(){const el=document.getElementById('draft');if(el){const e=enquiries.find(e=>e.id===active);if(e)e.draft=el.value}}
function renderNav(){for(const id of ['railnav','mobileNav'])document.getElementById(id).innerHTML=navs.map(([id,ico,label])=>`<button data-view="${id}" ${view===id?'aria-current="page"':''} aria-label="${label}${id==='review'?' ('+reviews.length+')':''}">${icon(ico)}<span class="${id==='mobileNav'?'':'tip'}">${label}</span></button>`).join('');document.querySelectorAll('#mobileNav .tip').forEach(el=>el.classList.remove('tip'))}
function renderQueue(){const list=enquiries.filter(e=>e.state===filter);document.getElementById('items').innerHTML=list.length?list.map(e=>`<button class="queue-item" data-enquiry="${e.id}" aria-current="${active===e.id&&view==='desk'}"><span class="person-line"><strong>${e.name}</strong><time>${e.time}</time></span><p>${esc(e.text)}</p><span class="item-foot">${e.state==='ready'?'<span class="urgent-dot"></span>':''}${esc(e.reason)}<span class="value mono">${money(e.price)}</span></span></button>`).join(''):'<div class="queue-empty">Nothing waiting here. You’re up to date.</div>';const count=enquiries.filter(e=>e.state==='ready').length;document.getElementById('readyCount').textContent=count;document.getElementById('waitingCount').textContent=enquiries.filter(e=>e.state==='waiting').length;document.getElementById('queueCount').textContent=String(list.length).padStart(2,'0');document.getElementById('dailyCount').textContent=`${replied} of 7`;document.getElementById('progress').innerHTML=Array.from({length:7},(_,i)=>`<span class="${i<replied?'done':''}"></span>`).join('');document.querySelectorAll('[data-filter]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.filter===filter)))}
function render(){renderNav();renderQueue();document.getElementById('breadcrumb').textContent=navs.find(n=>n[0]===view)[2];const el=document.getElementById('view');if(view==='desk')el.innerHTML=desk();if(view==='ledger')el.innerHTML=revenue();if(view==='review')el.innerHTML=review();if(view==='settings')el.innerHTML=settings();document.title=`DealDock · ${navs.find(n=>n[0]===view)[2]}`}
function desk(){const e=enquiries.find(e=>e.id===active);if(!e||e.state==='closed')return `<section class="view empty"><span class="eyebrow">One less loose end</span><h2>That one’s taken care of.</h2><p>Choose another enquiry from your queue. Your progress stays here while you work.</p><button class="primary" data-action="next">Next enquiry ${icon('arrow')}</button></section>`;const waiting=e.state==='waiting';return `<section class="desk-heading"><div class="overline"><span>WEDNESDAY, 28 OCTOBER</span><span>${waiting?'AWAITING A REPLY':'ENQUIRY '+String(enquiries.indexOf(e)+1).padStart(2,'0')}</span></div><h1>${waiting?'Give it a little space.':'A buyer. A question. Your next move.'}</h1><div class="route-steps" aria-label="Conversation stage"><span><b class="step-n">1</b>Understand</span><span class="connector"></span><span class="${waiting?'':'current'}"><b class="step-n">2</b>Reply</span><span class="connector"></span><span class="${waiting?'current':''}"><b class="step-n">3</b>Outcome</span></div></section><div class="case"><section class="reading" aria-label="Conversation and reply"><div class="sender"><span class="monogram" aria-hidden="true">${e.initials}</span><div><strong>${e.name}</strong><small>@${e.handle} · Instagram</small></div><time>${e.time} ago</time></div><p class="inbound">${esc(e.text)}</p><button class="history-toggle" data-action="history" aria-expanded="${historyOpen}" aria-controls="history">${icon('down')}${historyOpen?'Hide':'Earlier in'} this conversation</button><div class="history" id="history" ${historyOpen?'':'hidden'}><p>${esc(e.history)}</p></div><div class="divider"></div>${waiting?`<div class="success-note"><strong>${e.reason}</strong><br>${esc(e.detail)}<br>No message is scheduled.</div><button class="text-button" data-action="reopen">Move back to reply desk ${icon('arrow')}</button>`:`<div class="reply-label"><span><strong>Your reply</strong><span class="voice-tag">${voice?'Drafted in your voice':'Your own words'}</span></span><span class="muted" id="editState">Ready for your review</span></div><div class="editor"><label for="draft" class="skip">Review and edit your reply to ${e.name}</label><textarea id="draft" spellcheck="true" maxlength="4000">${esc(e.draft)}</textarea><div class="editor-tools"><button class="text-button" data-action="rewrite">${icon('refresh')}Start from the original draft</button><span class="mono" id="charCount">${e.draft.length}/4000</span></div><div class="editor-approve"><span class="approve-note">Read it. Make it yours.<br>Then give it the go-ahead.</span><button class="primary" data-action="approve" ${!e.draft.trim()?'disabled':''}>Approve reply ${icon('arrow')}</button></div></div><div class="after-editor"><span>${icon('lock')}Nothing sends without you.</span><span>Reply window · ${e.window}</span></div><p class="error" id="replyError" role="alert" hidden></p>`}</section><aside class="context" aria-label="Enquiry context"><h2>What’s on the table</h2><div class="offer-name">${e.offer}</div><p class="offer-desc">${e.offerDesc}</p><p class="price mono">${money(e.price)}</p><p class="estimate-caption">${e.id==='kabir'?'Their stated budget':'Estimated opportunity'} · not revenue</p><button class="outline-link" data-action="estimate">How was this estimated? ${icon('arrow')}</button><div class="why"><h3>THE CONTEXT, AT A GLANCE</h3><div class="reason"><span class="mono">01</span><p>${esc(e.reason)}<small>${esc(e.detail)}</small></p></div><div class="reason"><span class="mono">02</span><p>${e.id==='meera'?'Answer the payment question':'Keep the next step simple'}<small>${e.id==='meera'?'Two equal payments are in your offer terms.':'Give them one clear thing to respond to.'}</small></p></div><div class="reason"><span class="mono">03</span><p>You have the final say<small>Adjust the reply or the estimate before moving on.</small></p></div></div><div class="context-actions">${!waiting?`<button data-action="wait">${icon('clock')}I’ve replied elsewhere</button>`:''}<button data-action="sale">${icon('ledger')}Record a sale</button></div></aside></div>`}
function revenue(){let total=ledger.reduce((a,e)=>a+e.amount,0);return `<section class="view"><span class="eyebrow muted">The outcome</span><h1 style="margin-top:8px">Conversations that became revenue.</h1><p class="intro">Only sales you’ve confirmed. Estimates from your reply desk never appear here.</p><div class="ledger-total mono">${money(total)}</div><div class="ledger-summary">${ledger.length} confirmed sales · October 2026 <span style="padding:0 8px">/</span> Reported by you</div><div class="toolbar"><strong style="font-size:13px">Your revenue record</strong><button class="secondary" data-action="csv">Download CSV</button></div><div class="table-wrap"><table><caption class="skip">Confirmed sales in October 2026</caption><thead><tr><th scope="col">Conversation</th><th scope="col">Offer</th><th scope="col">Confirmed</th><th scope="col">Amount · INR</th></tr></thead><tbody>${ledger.map(e=>`<tr><td><strong>${esc(e.name)}</strong></td><td>${e.type}</td><td>${e.date}</td><td class="mono">${money(e.amount)}</td></tr>`).join('')}</tbody></table></div><p class="intro" style="margin-top:25px">A clear record of the conversations you helped move forward. This is self-reported revenue, not payment verification or proof of attribution.</p></section>`}
function review(){return `<section class="view"><span class="eyebrow muted">Your judgement matters</span><h1 style="margin-top:8px">A second look.</h1><p class="intro">DealDock wasn’t confident about these messages. Decide what belongs on your reply desk. No draft is sent or approved here.</p>${reviews.length?reviews.map(r=>`<article class="review-card"><div><h2>${r.name}</h2><p>“${r.text}”</p><small>${r.note}</small></div><button class="secondary" data-review="${r.id}">Review message ${icon('arrow')}</button></article>`).join(''):'<div class="empty"><h2>All clear.</h2><p>Every uncertain message has had a human look. New ones will appear here.</p></div>'}</section>`}
function settings(){return `<section class="view"><span class="eyebrow muted">Make yourself at home</span><h1 style="margin-top:8px">Your workspace, your terms.</h1><p class="intro">The details that keep DealDock useful and predictable.</p><div class="setting-row"><div><h2>Instagram connection</h2><p>@anika.thepractice · fictional account in this prototype</p></div><span class="muted" style="font-size:11px">Demo data</span></div><div class="setting-row"><div><h2>Draft in my voice</h2><p>Use your approved writing style for suggested replies. You can always edit before approving.</p></div><input type="checkbox" id="voice" aria-label="Draft replies in my voice" ${voice?'checked':''}></div><div class="setting-row"><div><h2>Workspace currency</h2><p>INR · fixed for this workspace so your history stays consistent.</p></div><span class="mono">₹ INR</span></div><div class="setting-row"><div><h2>Approval before every send</h2><p>Built into DealDock. There is no setting for automatic sending.</p></div>${icon('lock')}</div><div class="setting-row"><div><h2>About this prototype</h2><p>Fictional conversations. Changes live only in this browser session.</p></div><button class="secondary" data-action="help">Details</button></div></section>`}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').showModal()}
function selectEnquiry(id){saveDraft();active=id;view='desk';historyOpen=false;document.getElementById('app').dataset.mobile='detail';render();if(matchMedia('(max-width:580px)').matches)window.scrollTo({top:0,behavior:'instant'})}
function next(){const next=enquiries.find(e=>e.state==='ready');if(next)selectEnquiry(next.id);else{active='';render()}}
const originalDrafts=Object.fromEntries(enquiries.map(e=>[e.id,e.draft]));
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.view){saveDraft();view=b.dataset.view;if(view==='desk'&&matchMedia('(max-width:580px)').matches)document.getElementById('app').dataset.mobile='queue';else document.getElementById('app').dataset.mobile='detail';render();return}if(b.dataset.enquiry){selectEnquiry(b.dataset.enquiry);return}if(b.dataset.filter){filter=b.dataset.filter;renderQueue();return}if(b.dataset.review){const r=reviews.find(r=>r.id===b.dataset.review);openModal('Your call.',`<p><strong>${r.name}</strong></p><p>“${r.text}”</p><form id="reviewForm" data-id="${r.id}"><label for="reviewLabel">What is this conversation?</label><select id="reviewLabel"><option value="coaching">A coaching enquiry</option><option value="partnership">A potential partnership</option><option value="other">Not a buyer enquiry</option></select><p>This decision changes where the message appears. It never approves a reply.</p><button class="primary" type="submit">Save my decision ${icon('check')}</button></form>`);return}const a=b.dataset.action;if(!a)return;const e=enquiries.find(e=>e.id===active);if(a==='dismiss'){document.getElementById('modal').close();return}if(a==='back'){saveDraft();document.getElementById('app').dataset.mobile='queue';return}if(a==='next'){next();return}if(a==='history'){historyOpen=!historyOpen;saveDraft();render();document.querySelector('[data-action=history]').focus();return}if(a==='help'){openModal('A working idea. A safe place to try it.',`<p>This is one design direction for the authenticated DealDock product: <strong>the Reply desk.</strong> It focuses on the next useful response, with offer context at hand and revenue recorded only after your confirmation.</p><p>Try editing Meera’s reply, approving it, reviewing an uncertain message, or recording a sale. Every conversation is fictional. No account is connected, no request is sent, and the workspace resets on refresh.</p><p>On a small screen, use Reply desk in the bottom navigation to return to the queue. Use ⌘/Ctrl K to search.</p>`);return}if(a==='workspace'){openModal('The Practice',`<p>Anika’s movement coaching workspace. One creator, one connected Instagram account, and an offer catalogue that helps ground every estimate.</p><p>Workspace switching is intentionally outside this single-workspace prototype.</p>`);return}if(a==='search'){openModal('Find a conversation',`<label for="searchInput">Search by name or message</label><input id="searchInput" type="search" autocomplete="off" placeholder="Try Meera or November"><div id="searchResults"></div>`);search('');return}if(a==='rewrite'){document.getElementById('draft').value=originalDrafts[e.id];saveDraft();draftInput();notify('Original draft restored. Review it before approving.');return}if(a==='approve'){saveDraft();if(!e.draft.trim()){document.getElementById('replyError').hidden=false;document.getElementById('replyError').textContent='Write a reply before approving.';return}openModal('Give this reply the go-ahead?',`<p>To <strong>${e.name}</strong> · @${e.handle}</p><div style="white-space:pre-wrap;font-size:14px;line-height:1.8;border-block:1px solid var(--line);padding:17px 0">${esc(e.draft)}</div><p>In the real app, this approval sends your reply through DealDock’s protected send gate. Here, it only updates the fictional workspace.</p><button class="primary" data-action="confirmApprove">Approve in this prototype ${icon('arrow')}</button>`);return}if(a==='confirmApprove'){e.state='waiting';e.status='sent';e.reason='Waiting for '+e.name.split(' ')[0];e.detail='Your approved reply is recorded in this prototype. No real message was sent.';e.history+='\nYour approved reply: '+e.draft;replied=Math.min(7,replied+1);document.getElementById('modal').close();notify('Reply approved in the prototype. Nothing was sent to Instagram.');next();return}if(a==='wait'){e.state='waiting';e.reason='Replied on Instagram';e.detail='Marked as handled by you. No message was sent by DealDock.';notify('Moved to Waiting. No reply was sent.');next();return}if(a==='reopen'){e.state='ready';e.draft=originalDrafts[e.id]||'';e.reason='Ready for your reply';filter='ready';render();return}if(a==='estimate'){openModal('An estimate, with its working shown.',`<p><strong>${money(e.price)}</strong> · ${e.id==='kabir'?'budget stated by the sender':'based on your listed offer price'}.</p><p>${esc(e.detail)} This is the potential value of this conversation, not a sale or a probability-weighted forecast.</p><form id="estimateForm"><label for="estimateAmount">Your estimate · INR</label><input id="estimateAmount" type="number" min="0" max="10000000" step="0.01" required value="${e.price/100}"><p class="error" id="estimateError" role="alert" hidden></p><button class="primary" type="submit">Update estimate ${icon('check')}</button></form>`);return}if(a==='sale'){openModal('A conversation became a sale.',`<p>Record only the amount you’ve confirmed with <strong>${e.name}</strong>. This adds to your revenue record; it does not collect a payment.</p><form id="saleForm"><label for="saleAmount">Confirmed amount · INR</label><input id="saleAmount" type="number" min="0.01" max="10000000" step="0.01" required value="${e.price/100}"><label for="saleType">Offer type</label><select id="saleType"><option>${e.kind}</option><option>Other</option></select><p class="error" id="saleError" role="alert" hidden></p><button class="primary" type="submit">Confirm and record sale ${icon('check')}</button></form>`);return}if(a==='csv'){const rows=[['Conversation','Offer','Confirmed','Currency','Amount minor'],...ledger.map(e=>[e.name,e.type,e.date,'INR',e.amount])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='dealdock-prototype-revenue.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Fictional revenue record exported.');return}});
function draftInput(){const ta=document.getElementById('draft');if(!ta)return;document.getElementById('charCount').textContent=ta.value.length+'/4000';document.getElementById('editState').textContent=ta.value===originalDrafts[active]?'Ready for your review':'Edited by you';document.querySelector('[data-action=approve]').disabled=!ta.value.trim();saveDraft()}
function search(term){const result=enquiries.filter(e=>(e.name+' '+e.handle+' '+e.text).toLowerCase().includes(term.toLowerCase()));document.getElementById('searchResults').innerHTML=result.length?result.map(e=>`<button class="search-result" data-search-enquiry="${e.id}"><strong>${e.name}</strong><small>${esc(e.text.slice(0,90))}…</small></button>`).join(''):'<p>No conversations match. Try a name or a different phrase.</p>'}
document.addEventListener('input',event=>{if(event.target.id==='draft')draftInput();if(event.target.id==='searchInput')search(event.target.value)});
document.addEventListener('change',event=>{if(event.target.id==='voice'){voice=event.target.checked;notify(voice?'Voice-matched drafts enabled for this prototype.':'Voice-matched drafts disabled for this prototype.')}});
document.addEventListener('click',event=>{const b=event.target.closest('[data-search-enquiry]');if(b){document.getElementById('modal').close();selectEnquiry(b.dataset.searchEnquiry)}});
document.addEventListener('submit',event=>{const form=event.target;event.preventDefault();if(form.id==='saleForm'||form.id==='estimateForm'){const sale=form.id==='saleForm';const rawAmount=document.getElementById(sale?'saleAmount':'estimateAmount').value;const parts=/^(\d+)(?:\.(\d{1,2}))?$/.exec(rawAmount);const minor=parts?Number(BigInt(parts[1])*100n+BigInt((parts[2]||'').padEnd(2,'0'))):NaN;if(!Number.isSafeInteger(minor)||minor<(sale?1:0)||minor>1000000000){const error=document.getElementById(sale?'saleError':'estimateError');error.hidden=false;error.textContent='Enter a valid amount up to ₹1,00,00,000.';return}const e=enquiries.find(e=>e.id===active);if(sale){ledger.unshift({name:e.name,type:document.getElementById('saleType').value,amount:minor,date:'28 Oct'});e.state='closed';view='ledger';notify('Sale recorded. Your revenue record has been updated.')}else{e.price=minor;notify('Estimate updated. Confirmed revenue is unchanged.')}document.getElementById('modal').close();render()}if(form.id==='reviewForm'){const r=reviews.find(r=>r.id===form.dataset.id);const label=document.getElementById('reviewLabel').value;if(label!=='other'){enquiries.push({id:r.id,name:r.name,handle:r.name.toLowerCase().replaceAll(' ','.'),initials:r.name.split(' ').map(n=>n[0]).join('').slice(0,2),time:'Just reviewed',kind:label==='coaching'?'Coaching':'Partnership',price:label==='coaching'?2250000:0,offer:label==='coaching'?'The 8-week Practice':'Scope to be agreed',offerDesc:'Human-reviewed enquiry',text:r.text,draft:'',reason:'Reviewed by you',detail:'Classification confirmed by a person. Value still needs your judgement.',history:'This is the first message in this conversation.',state:'ready',window:'18h',status:'draft'});originalDrafts[r.id]=''}reviews=reviews.filter(x=>x.id!==r.id);document.getElementById('modal').close();render();notify(label==='other'?'Removed from buyer enquiries.':'Added to your reply desk. No reply was approved.')}});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!document.getElementById('modal').open)document.querySelector('[data-action=search]').click()}});
document.getElementById('modal').addEventListener('click',event=>{if(event.target===event.currentTarget){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.target.close()}});
render();
</script>
</body></html>
